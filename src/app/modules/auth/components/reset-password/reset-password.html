<div class="change-password-page">

  <!-- Background Image -->
  <img
    src="https://www.rithwik.co.in/wp-content/uploads/2026/06/office-fitting-scaled.jpg"
    class="background-image"
    alt="EMS Office"
  />

  <!-- Overlay -->
  <div class="background-overlay"></div>

  <!-- Content -->
  <div class="position-relative z-1 min-vh-100 d-flex flex-column align-items-center justify-content-center px-3">

    <!-- Password Card -->
    <div class="card border-0 shadow-lg rounded-4 password-card">

      <div class="card-body p-4 p-md-4">

        <!-- Card Header -->
        <div class="d-flex align-items-center justify-content-between mb-4">

          <div>
            <h4 class="fw-bold text-dark mb-1">
              Change Password
            </h4>

            <small class="text-body-secondary">
              Enter your current and new password
            </small>
          </div>

          <div class="password-icon">
            <i class="fa-solid fa-lock text-primary-emphasis"></i>
          </div>

        </div>

        <!-- FORM -->
        <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">

          <!-- CURRENT PASSWORD -->
          <div class="mb-3">

            <label for="currentPassword" class="form-label fw-semibold">
              Current Password
            </label>

            <div class="input-group">

              <span class="input-group-text bg-light border-end-0">
                <i class="fa-solid fa-lock text-secondary"></i>
              </span>

              <input
                id="currentPassword"
                class="form-control border-start-0 border-end-0"
                placeholder="Enter your current password"
                formControlName="currentPassword"
                [type]="showCurrentPassword ? 'text' : 'password'"
              />

              <button
                type="button"
                class="btn border border-start-0 bg-white text-secondary"
                (click)="showCurrentPassword = !showCurrentPassword"
              >
                <i
                  class="fa-solid"
                  [class.fa-eye]="!showCurrentPassword"
                  [class.fa-eye-slash]="showCurrentPassword"
                ></i>
              </button>

            </div>
          </div>


          <!-- NEW PASSWORD -->
          <div class="mb-3">

            <label for="newPassword" class="form-label fw-semibold">
              New Password
            </label>

            <div class="input-group">

              <span class="input-group-text bg-light border-end-0">
                <i class="fa-solid fa-lock text-secondary"></i>
              </span>

              <input
                id="newPassword"
                class="form-control border-start-0 border-end-0"
                placeholder="Enter your new password"
                formControlName="newPassword"
                [type]="showNewPassword ? 'text' : 'password'"
              />

              <button
                type="button"
                class="btn border border-start-0 bg-white text-secondary"
                (click)="showNewPassword = !showNewPassword"
              >
                <i
                  class="fa-solid"
                  [class.fa-eye]="!showNewPassword"
                  [class.fa-eye-slash]="showNewPassword"
                ></i>
              </button>

            </div>
          </div>


          <!-- CONFIRM PASSWORD -->
          <div class="mb-4">

            <label for="confirmPassword" class="form-label fw-semibold">
              Confirm New Password
            </label>

            <div class="input-group">

              <span class="input-group-text bg-light border-end-0">
                <i class="fa-solid fa-lock text-secondary"></i>
              </span>

              <input
                id="confirmPassword"
                class="form-control border-start-0 border-end-0"
                placeholder="Confirm your new password"
                formControlName="confirmPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
              />

              <button
                type="button"
                class="btn border border-start-0 bg-white text-secondary"
                (click)="showConfirmPassword = !showConfirmPassword"
              >
                <i
                  class="fa-solid"
                  [class.fa-eye]="!showConfirmPassword"
                  [class.fa-eye-slash]="showConfirmPassword"
                ></i>
              </button>

            </div>
          </div>


          <!-- UPDATE BUTTON -->
          <button
            type="submit"
            class="btn btn-primary w-100 py-2 rounded-3 fw-semibold"
            [disabled]="resetPasswordForm.invalid"
          >
            Update Password
          </button>

        </form>
        

        <!-- HELP -->
        <div class="text-muted-50 mt-3 text-center">
          <small>
            Need Help?
            <p class="text-primary-emphasis text-decoration-none fw-semibold pointer-cursor d-inline">
              Contact Administrator
            </p>
          </small>
        </div>

      </div>
    </div>

  </div>
</div>
