<div class="login-page container-fluid vh-100 bg-page">
  <div class="row h-100">
    <!-- Left Side -->
    <div class="col-lg-8 d-none d-lg-flex p-3 bg-light-subtle">
      <div class="left-panel position-relative w-100 rounded-5 overflow-hidden">
        <img
          src="https://www.rithwik.co.in/wp-content/uploads/2026/06/office-fitting-scaled.jpg"
          class="w-100 h-100 object-fit-cover rounded-3"
          alt="EMS Illustration"
        />

        <div class="overlay"></div>
      </div>
    </div>

    <!-- Right Side -->
    <div class="col-12 col-lg-4 d-flex align-items-center bg-white">
      <div class="login-wrapper mx-auto w-100">
        <!-- Brand -->
        <div class="d-flex align-items-center gap-2 mb-2">
          <div class="brand-dot"></div>

          <h5 class="fw-semibold text-primary-emphasis">EMS</h5>
        </div>

        <!-- Heading -->
        <h1 class="fw-bold text-dark mb-2">Welcome Back</h1>

        <p class="text-body-secondary mb-5">
          You have to Login first to access your account and employee services.
        </p>

        <form class="me-5" [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold text-primary-emphasis">
              Email
            </label>

            <div class="input-group">

              <span class="input-group-text bg-light">
                <i class="fa-solid fa-user"></i>
              </span>

              <input
                id="email"
                type="text"
                class="form-control p-2 px-3"
                placeholder="Enter email"
                formControlName = 'email'
                required="true"
              />
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold text-primary-emphasis">
              Password
            </label>

            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="fa-solid fa-lock"></i>
              </span>

              <input
                id="password"
                type="password"
                class="form-control p-2 px-3"
                placeholder="Enter password"
                formControlName = 'password'
                required="true"
              />
            </div>
          </div>

          <div class="form-check mb-4">
            <input id="remember" class="form-check-input" type="checkbox" />

            <label for="remember" class="form-check-label text-body-secondary"> Remember me </label>
          </div>

          <button
            type="submit"
            class="btn login-btn btn-lg rounded-3 w-100 text-light fs-6 fw-semibold"
            [disabled]="loginForm.invalid"
          >
            Login
          </button>
        </form>

        <div class="mt-4">
          <small class="text-body-secondary">
            Need help?

            <a href="#" class="text-decoration-none fw-semibold text-primary-emphasis">
              Contact Administrator
            </a>
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
