<div class="container-fluid vh-100 bg-light p-4">
  <div class="container-fluid h-100 bg-white border rounded-5 shadow-sm overflow-hidden pe-3">
    <div class="row h-100">

      <!-- ================= LEFT IMAGE ================= -->

      <div class="col-lg-8 d-none d-lg-block p-0 pe-3">
        <div class="position-relative h-100 overflow-hidden rounded-5 rounded-end-0">
          <img
            src="https://www.rithwik.co.in/wp-content/uploads/2026/06/office-fitting-scaled.jpg"
            class="w-100 h-100 object-fit-cover"
            alt="EMS Office"
          />

          <div class="image-overlay"></div>

          <!-- Image Content -->
          <div class="position-absolute bottom-0 start-0 text-white p-5">
            <div
              class="d-flex align-items-center justify-content-center bg-white bg-opacity-25 rounded-4 mb-4"
              style="width: 55px; height: 55px"
            >
              <i class="fa-solid fa-users fs-4"></i>
            </div>

            <h2 class="fw-bold mb-3">Empowering Teams,<br /> Driving Excellence </h2>
            <p class="mb-0 opacity-75">Streamline operations, enhance productivity,<br /> and achieve more together.</p>

          </div>
        </div>
      </div>

      <!-- ================= RIGHT FORM ================= -->

      <div class="col-12 col-lg-4 pe-4">
        <div class="h-100 d-flex align-items-center">
          <div class="w-100 px-3 py-4 pb-0  ">
            <!-- Brand -->
            <div class="d-flex align-items-center gap-2 mb-3">
              <span class=" blue-circle rounded-circle"></span>
              <span class="fw-bold fs-5 text-primary-emphasis"> EMS </span>
            </div>

            <div class="mb-4">
              <h1 class="fw-bold text-dark mb-2">Welcome Back</h1>

              <p class="text-body-secondary lh-lg mb-0">
                You have to Login first to access your account and employee services.
              </p>
            </div>

            <!-- FORM -->
            <form [formGroup]="loginForm" (ngSubmit)="login()">
              <!-- EMAIL -->
              <div class="mb-4">
                <label for="email" class="form-label fw-semibold"> Email </label>

                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="fa-solid fa-user text-secondary"></i>
                  </span>

                  <input id="email" type="email" class="form-control border-start-0 py-2" placeholder="Enter your email" formControlName="email"/>
                </div>
              </div>

              <!-- PASSWORD -->
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold"> Password </label>

                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="fa-solid fa-lock text-secondary"></i>
                  </span>

                  <input id="password" class="form-control border-start-0 border-end-0 py-2"
                  placeholder="Enter your password" formControlName="password"
                  [type]="showPassword ? 'text' : 'password'"  
                  />

                  <button type="button" class="btn border border-start-0 bg-white text-secondary" (click)="showPassword = !showPassword">
                    <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
                  </button>
                </div>
              </div>

              <!-- REMEMBER -->
              <div class="form-check mb-4">
                <input id="remember" class="form-check-input" type="checkbox" />
                <label for="remember" class="form-check-label text-body-secondary">Remember me</label>
              </div>

              <!-- LOGIN BUTTON -->
              <button class="btn btn-primary w-100 py-2 rounded-3 fw-semibold shadow-sm" 
              [disabled]="loginForm.invalid">
                Login
              </button>
            </form>

            <!-- HELP -->
            <div class="text-center mt-5">

              <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
                <hr class="flex-grow-1 m-0">
                <p class=" m-0 text-body-secondary">Need Help</p>
                <hr class="flex-grow-1 m-0">
              </div>
              <p class="text-body-secondary">Contact
                <a href="#" class="text-decoration-none fw-semibold text-primary-emphasis">Administrator</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
