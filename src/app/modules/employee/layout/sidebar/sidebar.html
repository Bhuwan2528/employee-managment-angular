<aside class="sidebar bg-white border-end d-flex flex-column vh-100">

    <!-- ===================== Brand ===================== -->

    <div class="sidebar-brand border-bottom px-4 py-4">
        <h2 class="fw-bold text-primary-emphasis mb-1">
            EMS
        </h2>
        <p class="text-body-secondary mb-0">
            Employee Management System
        </p>
    </div>

    <!-- ===================== Navigation ===================== -->

    <nav class="sidebar-nav nav flex-column px-1 py-3 flex-grow-1">

        @for(item of menuItems; track item.route){

        <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{exact:true}"
            class="sidebar-link nav-link d-flex align-items-center gap-3 rounded-3 px-4 py-3 mb-2">

            <i [class]="item.icon"></i>

            <span>
                {{item.label}}
            </span>

        </a>

        }

    </nav>

    <!-- ===================== Footer ===================== -->

    <div class="sidebar-footer border-top p-3 px-2">

        <!-- Profile -->

        <a
            routerLink="../admin/home"
            routerLinkActive="active"
            class="profile-card text-decoration-none rounded-3 d-flex align-items-center gap-3 p-2 px-1 mb-3">

            <div class="profile-image position-relative">
                <img
                    src="https://img.magnific.com/premium-photo/anime-male-portrait-with-hoodie_1410957-59738.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="Profile"
                    class="rounded-circle">
                <span class="online-status"></span>
            </div>

            <div class="flex-grow-1">
                <h6 class="mb-1 fw-semibold text-dark">
                    {{user?.role?.name}}
                </h6>
                <small class="text-body-secondary">
                    {{user?.email}}
                </small>
            </div>
            
        </a>

        <!-- Logout -->

        <button class="logout-btn btn btn-outline-danger w-100 rounded-3 d-flex align-items-center justify-content-center gap-2" (click)="(logout())">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>
                Logout
            </span>
        </button>

    </div>

</aside>
