<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-4">My Profile</h3>

          <!-- Profile Image -->
           
          <form [formGroup]="profileForm">

            <div class="text-center mb-4">
              <div class="profile-image mx-auto">
                <img [src]="imagePreview" class="img-fluid rounded-circle" alt="Profile" />
              </div>

              <input
                #fileInput
                type="file"
                class="d-none"
                accept="image/*"
                (change)="onImageSelected($event)"
              />

              <button
                type="button"
                class="btn btn-outline-primary btn-sm mt-3 text-primary-emphasis"
                (click)="fileInput.click()"
              >
                Change Photo
              </button>
            </div>

            <div class="row g-3">
              <div class="col-md-6 mb-2">
                <label class="form-label text-dark fw-semibold"> First Name </label>

                <input type="text" class="form-control" placeholder="First Name" formControlName="firstName" />
              </div>

              <div class="col-md-6 mb-2">
                <label class="form-label text-dark fw-semibold"> Last Name </label>

                <input type="text" class="form-control" placeholder="Last Name" formControlName="lastName"/>
              </div>

              <div class="col-6 mb-2">
                <label class="form-label text-dark fw-semibold"> Mobile Number </label>
                <input type="text" class="form-control" placeholder="+91 9876543210" formControlName="phone"/>
              </div>

              <div class="col-6 mb-4">
                <label class="form-label text-dark fw-semibold"> Date Of Birth (dd/mm/yyy) </label>
                <input type="text" class="form-control" placeholder="01/01/1999" formControlName="dateOfBirth" />

                @if ( profileForm.get('dateOfBirth')?.touched && profileForm.get('dateOfBirth')?.hasError('pattern') ) {
                  <small class="text-danger">
                    Date of birth must be in DD/MM/YYYY format
                  </small>
                }
              </div>
            </div>

            <div class="d-grid mt-4">
              <button class="btn btn-primary btn-lg">Save Changes</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
